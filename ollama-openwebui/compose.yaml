---
x-defaults: &defaults
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
services:
  ollama:
    <<: *defaults
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    image: docker.io/ollama/ollama:0.32.1
    devices:
      - nvidia.com/gpu=all
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ports:
      - 127.0.0.1:11434:11434
    volumes:
      - ollama:/root/.ollama
  openwebui:
    <<: *defaults
    restart: unless-stopped
    image: ghcr.io/open-webui/open-webui:v0.10.2
    depends_on:
      - ollama
    ports:
      - 127.0.0.1:3000:8080
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      WEBUI_AUTH: "false"
    volumes:
      - open-webui:/app/backend/data
  model-loader:
    <<: *defaults
    restart: on-failure
    read_only: true
    tmpfs:
      - /tmp
    image: docker.io/ollama/ollama:0.32.1
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "gemma4:12b"]
volumes:
  ollama:
  open-webui:
